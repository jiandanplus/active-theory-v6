services:
  site:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SITE_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Local loopback demonstration only. Production uses compose.external.yaml.
      NODE_ENV: development
      HOST: 0.0.0.0
      SITE_ORIGIN: ${SITE_ORIGIN:?Run npm run docker:up to initialize local config}
      DATABASE_URL: ${DATABASE_URL:?Set the non-superuser application database URL}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      LEGACY_SQLITE_PATH: ${LEGACY_SQLITE_PATH:-}
      SITE_MASTER_KEY: ${SITE_MASTER_KEY:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      S3_ENDPOINT_ALLOWLIST: ${S3_ENDPOINT_ALLOWLIST:-}
    volumes:
      - site-data:/app/data
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-site_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a separate bootstrap password}
      POSTGRES_DB: ${POSTGRES_DB:-personal_site}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-site_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set the application password}
    volumes:
      - pg-data:/var/lib/postgresql
      - type: bind
        source: ./docker/postgres-init.sh
        target: /docker-entrypoint-initdb.d/10-app-role.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  site-data:
  pg-data:
