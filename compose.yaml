services:
  site:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SITE_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      SITE_ORIGIN: ${SITE_ORIGIN:?Set the public HTTPS origin}
      DATABASE_URL: ${DATABASE_URL:?Set the non-superuser application database URL}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      LEGACY_SQLITE_PATH: ${LEGACY_SQLITE_PATH:-}
      SITE_MASTER_KEY: ${SITE_MASTER_KEY:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      S3_ENDPOINT_ALLOWLIST: ${S3_ENDPOINT_ALLOWLIST:-}
    volumes:
      - site-data:/app/data
      - ${SITE_ASSETS_DIR:-./assets}:/app/assets:ro
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-site_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a separate bootstrap password}
      POSTGRES_DB: ${POSTGRES_DB:-personal_site}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-site_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set the application password}
    volumes:
      - pg-data:/var/lib/postgresql
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  site-data:
  pg-data:
