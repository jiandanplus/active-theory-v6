services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: site_test
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: site_test_control
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site_test -d site_test_control"]
      interval: 2s
      timeout: 3s
      retries: 30
